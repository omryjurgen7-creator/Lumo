name: Build Lumo

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/Lumo_artefacts/Release/VST3/Lumo.vst3 -DestinationPath Lumo-Windows-VST3.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/Lumo_artefacts/Release
          ditto -c -k --keepParent VST3/Lumo.vst3 "$GITHUB_WORKSPACE/Lumo-macOS-VST3.zip"
          ditto -c -k --keepParent AU/Lumo.component "$GITHUB_WORKSPACE/Lumo-macOS-AU.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Lumo-${{ matrix.name }}
          path: Lumo-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Lumo-*.zip
